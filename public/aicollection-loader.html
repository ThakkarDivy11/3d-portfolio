<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Collection Engine - Intelligence Hub</title>
  
  <!-- Google Fonts: Bebas Neue and DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* ── 1. DESIGN SYSTEM VARIABLES ── */
    :root {
      --bg: #0b1528;
      --accent: #2d84ca;
      --accent-glow: rgba(45, 132, 202, 0.25);
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.3);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --glass-bg: rgba(17, 39, 64, 0.8);
      --glass-border: rgba(255, 255, 255, 0.08);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1.0);
    }

    /* ── 2. GLOBAL RESET ── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1000px;
    }

    /* Animated background grid and neon orb */
    .bg-effects {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .cz-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0.8;
      transform: rotateX(60deg) translateY(-30%) translateZ(0);
      transform-origin: top center;
      animation: gridScroll 20s linear infinite;
    }

    .neon-orb {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(50px);
      animation: orbFloat 10s ease-in-out infinite alternate;
    }

    /* ── 3. GLASS CARD LAYOUT ── */
    .loader-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 420px;
      padding: 40px 30px;
      border-radius: 24px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 40px rgba(45, 132, 202, 0.08);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: cardEntrance 1s var(--ease-spring) forwards;
    }

    /* ── 4. LOGO MARK & LOADER ── */
    .logo-wrapper {
      position: relative;
      margin-bottom: 35px;
    }

    /* Outer Orbit Spinner Ring */
    .orbit-spinner {
      position: absolute;
      top: -15px;
      left: -15px;
      right: -15px;
      bottom: -15px;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-bottom-color: var(--cyan);
      border-radius: 50%;
      animation: spin 2s cubic-bezier(0.53, 0.21, 0.29, 0.87) infinite;
    }

    /* Logo Center Block */
    .logo-mark {
      width: 76px;
      height: 76px;
      background: #0b1329;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .logo-letter {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--cyan);
      font-weight: 900;
      text-shadow: 0 0 10px var(--cyan-glow);
      animation: pulseText 2s ease-in-out infinite;
    }

    /* Shine effect moving across logo */
    .logo-mark::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 45%,
        rgba(255, 255, 255, 0.15) 50%,
        transparent 55%
      );
      transform: rotate(45deg);
      animation: shine 2.5s infinite;
    }

    /* ── 5. TEXT & STATUS HIERARCHY ── */
    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-text {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
      min-height: 20px;
      margin-bottom: 25px;
      letter-spacing: 0.02em;
      transition: opacity 0.3s ease;
    }

    /* ── 6. PROGRESS BAR ── */
    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent) 0%, var(--cyan) 100%);
      border-radius: 10px;
      box-shadow: 0 0 10px var(--cyan-glow);
      transition: width 0.4s cubic-bezier(0.1, 0.8, 0.2, 1);
    }

    .percent-indicator {
      margin-top: 10px;
      font-size: 12px;
      color: var(--cyan);
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* ── 7. KEYFRAMES ANIMATIONS ── */
    @keyframes gridScroll {
      0% { background-position: 0 0; }
      100% { background-position: 0 1000px; }
    }

    @keyframes orbFloat {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
      100% { transform: translate(-52%, -48%) scale(1.15); opacity: 0.9; }
    }

    @keyframes cardEntrance {
      0% { opacity: 0; transform: translateY(40px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseText {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes shine {
      0% { transform: translate(-100%, -100%) rotate(45deg); }
      80%, 100% { transform: translate(100%, 100%) rotate(45deg); }
    }
  </style>
</head>
<body>

  <!-- Background Animated Grids -->
  <div class="bg-effects">
    <div class="cz-grid"></div>
    <div class="neon-orb"></div>
  </div>

  <!-- Central Loader Glass Card -->
  <div class="loader-container">
    <div class="logo-wrapper">
      <div class="orbit-spinner"></div>
      <div class="logo-mark">
        <span class="logo-letter">AI</span>
      </div>
    </div>
    
    <h1 class="title">COLLECTION ENGINE</h1>
    <div class="status-text" id="status-label">Initializing system component matrices...</div>
    
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
    <div class="percent-indicator" id="percent-label">0%</div>
  </div>

  <!-- ── 8. SYSTEM SIMULATOR SCRIPT ── -->
  <script>
    const statuses = [
      "Initializing secure server connection...",
      "Setting up neural networks & models...",
      "Connecting Ollama & Mistral pipelines...",
      "Syncing background cron processes...",
      "Optimizing tool indexing engine...",
      "System online. Welcome to AI Engine!"
    ];

    const progressBar = document.getElementById('progress-bar');
    const statusLabel = document.getElementById('status-label');
    const percentLabel = document.getElementById('percent-label');

    let currentProgress = 0;
    let statusIndex = 0;

    function updateLoader() {
      if (currentProgress < 100) {
        let increment = Math.floor(Math.random() * 8) + 4; 
        currentProgress = Math.min(currentProgress + increment, 100);
        
        progressBar.style.width = currentProgress + '%';
        percentLabel.textContent = currentProgress + '%';

        let targetIndex = Math.floor((currentProgress / 100) * statuses.length);
        if (targetIndex !== statusIndex && targetIndex < statuses.length) {
          statusIndex = targetIndex;
          statusLabel.style.opacity = 0;
          setTimeout(() => {
            statusLabel.textContent = statuses[statusIndex];
            statusLabel.style.opacity = 1;
          }, 150);
        }

        let nextInterval = Math.floor(Math.random() * 150) + 80;
        setTimeout(updateLoader, nextInterval);
      } else {
        statusLabel.textContent = "Redirecting to Hub...";
        statusLabel.style.color = "#10B981"; // Success Green
        percentLabel.style.color = "#10B981";
        
        setTimeout(() => {
          document.querySelector('.loader-container').style.transform = 'scale(0.9) translateY(-20px)';
          document.querySelector('.loader-container').style.opacity = '0';
          document.querySelector('.loader-container').style.transition = 'all 0.5s ease-in-out';
          
          setTimeout(() => {
            window.location.href = "https://ai-collection-engineee.vercel.app/";
          }, 600);
        }, 800);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(updateLoader, 300);
    });
  </script>
</body>
</html>
