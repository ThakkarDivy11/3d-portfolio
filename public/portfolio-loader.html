<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Portfolio - Initializing</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #09090b;
      --accent: #d946ef;
      --accent-glow: rgba(217, 70, 239, 0.4);
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.4);
      --text: #f0f0f0;
      --text-muted: #a1a1aa;
      --glass-bg: rgba(15, 15, 20, 0.75);
      --glass-border: rgba(217, 70, 239, 0.15);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1.0);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1200px;
    }

    .bg-effects {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    /* 3D Wireframe Grid */
    .wire-grid {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background-image: 
        linear-gradient(rgba(217, 70, 239, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(217, 70, 239, 0.08) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.8;
      transform: rotateX(70deg) translateZ(0);
      transform-style: preserve-3d;
      animation: gridScroll 10s linear infinite;
    }

    .neon-orb {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(40px);
      animation: orbFloat 8s ease-in-out infinite alternate;
    }

    .loader-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 420px;
      padding: 40px 30px;
      border-radius: 24px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 40px rgba(217, 70, 239, 0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: cardEntrance 1s var(--ease-spring) forwards;
      transform-style: preserve-3d;
    }

    .logo-wrapper {
      position: relative;
      margin-bottom: 35px;
      perspective: 800px;
    }

    /* 3D Spinning Cube */
    .cube-container {
      width: 76px;
      height: 76px;
      position: relative;
      transform-style: preserve-3d;
      animation: spinCube 6s infinite linear;
    }

    .cube-face {
      position: absolute;
      width: 76px;
      height: 76px;
      background: rgba(9, 9, 11, 0.8);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(217, 70, 239, 0.3);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan-glow);
    }

    .cube-front  { transform: translateZ(38px); }
    .cube-back   { transform: rotateY(180deg) translateZ(38px); }
    .cube-right  { transform: rotateY(90deg) translateZ(38px); }
    .cube-left   { transform: rotateY(-90deg) translateZ(38px); }
    .cube-top    { transform: rotateX(90deg) translateZ(38px); }
    .cube-bottom { transform: rotateX(-90deg) translateZ(38px); }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 0.05em;
      margin-top: 10px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-text {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
      min-height: 20px;
      margin-bottom: 25px;
      letter-spacing: 0.02em;
      transition: opacity 0.3s ease;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan) 0%, var(--accent) 100%);
      border-radius: 10px;
      box-shadow: 0 0 10px var(--accent-glow);
      transition: width 0.4s cubic-bezier(0.1, 0.8, 0.2, 1);
    }

    .percent-indicator {
      margin-top: 10px;
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    @keyframes gridScroll { 
      0% { transform: rotateX(70deg) translateZ(0) translateY(0); } 
      100% { transform: rotateX(70deg) translateZ(0) translateY(120px); } 
    }
    @keyframes orbFloat { 
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; } 
      100% { transform: translate(-52%, -48%) scale(1.15); opacity: 0.9; } 
    }
    @keyframes cardEntrance { 
      0% { opacity: 0; transform: translateY(40px) scale(0.95); } 
      100% { opacity: 1; transform: translateY(0) scale(1); } 
    }
    @keyframes spinCube { 
      0% { transform: rotateX(-20deg) rotateY(0deg); } 
      100% { transform: rotateX(-20deg) rotateY(360deg); } 
    }
  </style>
</head>
<body>

  <div class="bg-effects">
    <div class="wire-grid"></div>
    <div class="neon-orb"></div>
  </div>

  <div class="loader-container">
    <div class="logo-wrapper">
      <div class="cube-container">
        <div class="cube-face cube-front">3D</div>
        <div class="cube-face cube-back">UI</div>
        <div class="cube-face cube-right">UX</div>
        <div class="cube-face cube-left">JS</div>
        <div class="cube-face cube-top"></div>
        <div class="cube-face cube-bottom"></div>
      </div>
    </div>
    
    <h1 class="title">IMMERSIVE PORTFOLIO</h1>
    <div class="status-text" id="status-label">Initializing WebGL context...</div>
    
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
    <div class="percent-indicator" id="percent-label">0%</div>
  </div>

  <script>
    const statuses = [
      "Rendering 3D models and textures...",
      "Configuring GSAP animations...",
      "Injecting spatial awareness...",
      "Compiling Framer Motion nodes...",
      "Lighting the virtual scene...",
      "Experience ready. Entering now!"
    ];

    const progressBar = document.getElementById('progress-bar');
    const statusLabel = document.getElementById('status-label');
    const percentLabel = document.getElementById('percent-label');

    let currentProgress = 0;
    let statusIndex = 0;

    function updateLoader() {
      if (currentProgress < 100) {
        let increment = Math.floor(Math.random() * 8) + 3; 
        currentProgress = Math.min(currentProgress + increment, 100);
        
        progressBar.style.width = currentProgress + '%';
        percentLabel.textContent = currentProgress + '%';

        let targetIndex = Math.floor((currentProgress / 100) * statuses.length);
        if (targetIndex !== statusIndex && targetIndex < statuses.length) {
          statusIndex = targetIndex;
          statusLabel.style.opacity = 0;
          setTimeout(() => {
            statusLabel.textContent = statuses[statusIndex];
            statusLabel.style.opacity = 1;
          }, 150);
        }

        let nextInterval = Math.floor(Math.random() * 150) + 100;
        setTimeout(updateLoader, nextInterval);
      } else {
        statusLabel.textContent = "Redirecting...";
        statusLabel.style.color = "#06b6d4"; 
        percentLabel.style.color = "#06b6d4";
        
        setTimeout(() => {
          document.querySelector('.loader-container').style.transform = 'scale(0.9) translateY(-20px)';
          document.querySelector('.loader-container').style.opacity = '0';
          document.querySelector('.loader-container').style.transition = 'all 0.5s ease-in-out';
          
          console.log("Loading complete, ready to route.");
          setTimeout(() => {
            window.location.href = "https://3d-portfolio-mu-plum.vercel.app/";
          }, 600);
        }, 800);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(updateLoader, 300);
    });
  </script>
</body>
</html>
